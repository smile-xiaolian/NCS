<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>路线导航</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #container { width: 100%; height: 100vh; }
    </style>
    <!-- ⚠️ 请务必替换为新申请且额度充足的 Key -->
    <script src="https://map.qq.com/api/gljs?v=1.exp&key=YOUR_NEW_TENCENT_KEY&libraries=service"></script>
</head>
<body>
<div id="container"></div>
<script>
    var map = null;
    var currentPolyline = null;
    var markers = [];

    function initMap() {
        try {
            map = new TMap.Map('container', {
                center: new TMap.LatLng(31.2304, 121.4737),
                zoom: 12
            });
            console.log("地图初始化成功！");
        } catch (e) {
            console.error("地图初始化失败:", e);
        }
    }

    function renderRoute(startLat, startLng, endLat, endLng, mode) {
        console.log("收到路线规划参数:", startLat, startLng, endLat, endLng, mode);
        if (!map) initMap();
        if (!map) return;

        // 清理旧标记
        markers.forEach(function(m) { m.setMap(null); });
        markers = [];
        if (currentPolyline) {
            currentPolyline.setMap(null);
            currentPolyline = null;
        }

        var startLatLng = new TMap.LatLng(startLat, startLng);
        var endLatLng = new TMap.LatLng(endLat, endLng);

        var markerLayer = new TMap.MultiMarker({
            id: 'marker-layer',
            map: map,
            geometries: [
                { id: 'start', position: startLatLng },
                { id: 'end', position: endLatLng }
            ]
        });
        markers.push(markerLayer);

        var bounds = new TMap.LatLngBounds();
        bounds.extend(startLatLng);
        bounds.extend(endLatLng);
        map.fitBounds(bounds, { padding: 60 });

        var routeService;
        if (mode === 'walk') {
            routeService = new TMap.service.Walking();
        } else if (mode === 'bus') {
            routeService = new TMap.service.Transit();
        } else {
            routeService = new TMap.service.Driving();
        }

        routeService.search({
            from: startLatLng,
            to: endLatLng
        }).then(function (result) {
            if (result.result && result.result.routes && result.result.routes.length > 0) {
                var route = result.result.routes[0];
                var path = (mode === 'bus') ? [] : route.polyline;
                if (mode === 'bus') {
                    route.steps.forEach(function(s) { if (s.path) path = path.concat(s.path); });
                }

                currentPolyline = new TMap.MultiPolyline({
                    id: 'polyline-layer',
                    map: map,
                    styles: {
                        'style_blue': new TMap.PolylineStyle({
                            'color': '#3777FF',
                            'width': 6
                        })
                    },
                    geometries: [{ id: 'route', styleId: 'style_blue', paths: path }]
                });
            }
        }).catch(function (err) {
            console.error("路线搜索失败:", err);
        });
    }

    window.onload = initMap;
</script>
</body>
</html>
