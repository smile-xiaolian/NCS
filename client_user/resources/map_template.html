<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>路线导航</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body, #container { width: 100%; height: 100%; overflow: hidden; }
    </style>
    <!-- 引入腾讯地图 2D API (v2.exp) -->
    <script src="https://map.qq.com/api/js?v=2.exp&key=VMNBZ-HQHE7-NH2XF-HGZCP-ZDC2T-FMFBU"></script>
</head>
<body>
<div id="container"></div>
<script>
    var map = null;
    var markers = [];
    var currentService = null;

    function initMap() {
        try {
            if (typeof qq === 'undefined' || typeof qq.maps === 'undefined') {
                console.error("qq.maps SDK 未成功加载！");
                return;
            }
            map = new qq.maps.Map(document.getElementById("container"), {
                center: new qq.maps.LatLng(31.2304, 121.4737),
                zoom: 12
            });
            console.log("腾讯地图 2D 初始化成功");
        } catch (e) {
            console.error("地图初始化异常:", e);
        }
    }

    function clearOldOverlays() {
        // 1. 清理旧 Marker
        for (var i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];

        // 2. 清理旧 Service 图层
        if (currentService && typeof currentService.clear === 'function') {
            try {
                currentService.clear();
            } catch (e) {}
        }
        currentService = null;
    }

    function renderRoute(startLat, startLng, endLat, endLng, mode) {
        console.log("渲染路线请求:", startLat, startLng, endLat, endLng, mode);
        if (!map) initMap();
        if (!map || typeof qq === 'undefined' || typeof qq.maps === 'undefined') return;

        // 防护拦截：如果终点坐标为 0,0，忽略检索
        if (endLat === 0 && endLng === 0) {
            console.warn("终点坐标无效 (0, 0)，暂停路线检索！");
            return;
        }

        // 清理上一次的路线图层与标记
        clearOldOverlays();

        var startLatLng = new qq.maps.LatLng(startLat, startLng);
        var endLatLng = new qq.maps.LatLng(endLat, endLng);

        // 添加起终点 Marker
        var startMarker = new qq.maps.Marker({ position: startLatLng, map: map, title: "起点" });
        var endMarker = new qq.maps.Marker({ position: endLatLng, map: map, title: "终点" });
        markers.push(startMarker);
        markers.push(endMarker);

        // 调整视野包含起终点
        var bounds = new qq.maps.LatLngBounds();
        bounds.extend(startLatLng);
        bounds.extend(endLatLng);
        map.fitBounds(bounds);

        try {
            if (mode === 'walk') {
                // 步行模式：使用 TransferService 不传 policy 参数，避免 undefined 异常
                currentService = new qq.maps.TransferService({
                    map: map
                });
                currentService.search(startLatLng, endLatLng);

            } else if (mode === 'bus') {
                // 公交模式：使用 TransferService
                currentService = new qq.maps.TransferService({
                    map: map
                });
                currentService.search(startLatLng, endLatLng);

            } else {
                // 驾车模式：使用 DrivingService
                currentService = new qq.maps.DrivingService({
                    map: map
                });
                currentService.search(startLatLng, endLatLng);
            }
        } catch (err) {
            console.error("路线服务实例化捕获异常:", err);
        }
    }

    window.onload = initMap;
</script>
</body>
</html>
